<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101b35"><title>NDA GAT CBT | ALL EXAM INDIA</title>
<style>
:root{--bg:#f3f6fc;--card:#fff;--ink:#17233d;--muted:#64718a;--line:#dfe6f1;--blue:#315ee8;--navy:#101b35}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,Arial,sans-serif}.top{background:var(--navy);color:#fff;padding:16px;position:sticky;top:0;z-index:3}.wrap{max-width:1000px;margin:auto}.toprow{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.timer{font-size:22px;font-weight:800;color:#ffe08a}.bar{height:5px;background:#ffffff30;margin-top:12px;border-radius:8px;overflow:hidden}.bar span{display:block;height:100%;background:#5de0c2;width:100%}main{max-width:1000px;margin:auto;padding:18px}.panel,.question,.result{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:18px;margin-bottom:14px}.hidden{display:none!important}button,select{font:inherit}button{border:0;border-radius:10px;padding:11px 15px;background:var(--blue);color:#fff;font-weight:700;cursor:pointer}button.secondary{background:#e9eef9;color:#1d315b}button.warn{background:#a63b32}.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:7px}.grid button{padding:8px 0;background:#e8edf6;color:#273956}.grid button.done{background:#c8f0df;color:#075b3e}.grid button.current{outline:3px solid #315ee855}.grid button.review{background:#ffe4a6;color:#704900}.opts{display:grid;gap:9px;margin-top:16px}.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:12px}.actions{display:flex;gap:9px;flex-wrap:wrap;justify-content:space-between;margin-top:18px}.muted{color:var(--muted)}.layout{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:14px}.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat{padding:13px;background:#eef3ff;border-radius:10px;text-align:center}.stat b{display:block;font-size:22px}@media(max-width:700px){.layout{grid-template-columns:1fr}.grid{grid-template-columns:repeat(8,1fr)}main{padding:12px}.statgrid{grid-template-columns:repeat(2,1fr)}}
</style></head><body>
<header class="top"><div class="wrap"><div class="toprow"><strong>NDA • GAT FULL MOCK TEST</strong><span class="timer" id="clock">150:00</span></div><div class="bar"><span id="timebar"></span></div></div></header>
<main class="wrap">
<section id="setup" class="panel"><h1>NDA GAT Mock Test</h1><p class="muted">150 Questions • 600 Marks • 150 Minutes • +4 correct • −1.3333 incorrect</p><label>Mock Test <select id="mock"><option value="01">Mock Test 01</option><option value="02">Mock Test 02</option><option value="03">Mock Test 03</option><option value="04">Mock Test 04</option><option value="05">Mock Test 05</option><option value="06">Mock Test 06</option><option value="07">Mock Test 07</option><option value="08">Mock Test 08</option><option value="09">Mock Test 09</option><option value="10">Mock Test 10</option><option value="11">Mock Test 11</option><option value="12">Mock Test 12</option><option value="13">Mock Test 13</option><option value="14">Mock Test 14</option><option value="15">Mock Test 15</option><option value="16">Mock Test 16</option><option value="17">Mock Test 17</option><option value="18">Mock Test 18</option><option value="19">Mock Test 19</option><option value="20">Mock Test 20</option></select></label> <label>Language <select id="lang"><option value="en">English</option><option value="hi">हिन्दी</option></select></label><p id="loadmsg" class="muted">Select a test and tap Start.</p><button id="start">Start Test</button> <a href="gat-mock.html">Back to test list</a></section>
<section id="exam" class="hidden"><div class="layout"><div><div class="question"><div class="muted" id="qmeta"></div><h2 id="qtext"></h2><div class="opts" id="options"></div><div class="actions"><button class="secondary" id="prev">Previous</button><button class="secondary" id="review">Mark for Review</button><button id="next">Save & Next</button></div></div></div><aside><div class="panel"><b>Question Palette</b><p class="muted">Green: answered • Yellow: review</p><div class="grid" id="palette"></div><hr><p id="progress" class="muted"></p><button class="warn" id="submit">Submit Test</button></div></aside></div></section>
<section id="result" class="hidden result"><h1>Test Result</h1><div class="statgrid" id="stats"></div><h2>Question-wise Solutions</h2><div id="solutions"></div><button onclick="location.reload()">Back to Test Selection</button></section>
</main>
<script>
const $=id=>document.getElementById(id);let qs=[],answers={},marked={},at=0,lang='en',left=9000,clock=null,finished=false;
function getText(q){return lang==='hi'?q.hi:q.en}function optionText(o){return Array.isArray(o)?o[lang==='hi'?1:0]:o}
async function loadBank(){let n=$('mock').value;let url='gat-question-bank-'+n+'.json';$('loadmsg').textContent='Checking question bank…';try{let r=await fetch(url,{cache:'no-store'});if(!r.ok)throw Error('not found');let d=await r.json();if(!Array.isArray(d.questions)||d.questions.length!==150)throw Error('This paper currently has '+(d.questions?.length||0)+' of 150 questions. It is not available as a full mock yet.');if(d.questions.some(q=>!q.en||!q.hi||!Array.isArray(q.options)||q.options.length!==4||!Number.isInteger(q.answer)||!q.solution_en||!q.solution_hi))throw Error('Question bank validation failed: bilingual question, four options, answer key and explanations are required.');return d}catch(e){$('loadmsg').textContent=e.message;return null}}
$('start').onclick=async()=>{lang=$('lang').value;let d=await loadBank();if(!d)return;qs=d.questions;$('setup').classList.add('hidden');$('exam').classList.remove('hidden');left=9000;render();clock=setInterval(()=>{left--;clockView();if(left<=0)submit()},1000)};
function clockView(){$('clock').textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0');$('timebar').style.width=(left/9000*100)+'%'}
function render(){let q=qs[at];$('qmeta').textContent='Question '+(at+1)+' of 150 • '+q.subject;$('qtext').textContent=getText(q);$('options').innerHTML='';q.options.forEach((o,i)=>{let lab=document.createElement('label');lab.className='opt';let inp=document.createElement('input');inp.type='radio';inp.name='answer';inp.checked=answers[at]===i;inp.onchange=()=>{answers[at]=i;palette()};lab.append(inp,document.createTextNode(' '+String.fromCharCode(65+i)+'. '+optionText(o)));$('options').append(lab)});$('prev').disabled=at===0;$('next').textContent=at===149?'Save':'Save & Next';palette()}
function palette(){$('palette').innerHTML='';qs.forEach((q,i)=>{let b=document.createElement('button');b.textContent=i+1;b.className=(answers[i]!==undefined?'done ':'')+(marked[i]?'review ':'')+(i===at?'current':'');b.onclick=()=>{at=i;render()};$('palette').append(b)});$('progress').textContent=Object.keys(answers).length+' answered • '+Object.keys(marked).length+' marked for review'}
$('prev').onclick=()=>{if(at>0){at--;render()}};$('next').onclick=()=>{if(at<149){at++;render()}else palette()};$('review').onclick=()=>{marked[at]=!marked[at];palette()};$('submit').onclick=()=>{if(confirm('Submit this test now?'))submit()};
function submit(){if(finished)return;finished=true;clearInterval(clock);let correct=0,wrong=0,blank=0;qs.forEach((q,i)=>{if(answers[i]===undefined)blank++;else if(answers[i]===q.answer)correct++;else wrong++});let score=correct*4-wrong*(4/3),acc=(correct+wrong)?correct/(correct+wrong)*100:0;$('exam').classList.add('hidden');$('result').classList.remove('hidden');$('stats').innerHTML=[['Score',score.toFixed(2)+' / 600'],['Correct',correct],['Incorrect',wrong],['Unanswered',blank],['Accuracy',acc.toFixed(2)+'%'],['Time Left',Math.floor(left/60)+' min']].map(x=>'<div class="stat"><b>'+x[1]+'</b>'+x[0]+'</div>').join('');$('solutions').innerHTML='';qs.forEach((q,i)=>{let d=document.createElement('details');let s=document.createElement('summary');s.textContent='Q'+(i+1)+' • '+(answers[i]===q.answer?'Correct':answers[i]===undefined?'Unanswered':'Incorrect');let p=document.createElement('p');p.textContent=getText(q);let a=document.createElement('p');a.textContent='Correct answer: '+optionText(q.options[q.answer]);let e=document.createElement('p');e.textContent=lang==='hi'?q.solution_hi:q.solution_en;d.append(s,p,a,e);$('solutions').append(d)});try{let h=JSON.parse(localStorage.getItem('ndaGatHistory')||'[]');h.unshift({mock:$('mock').value,score:score.toFixed(2),correct,wrong,blank,date:new Date().toISOString()});localStorage.setItem('ndaGatHistory',JSON.stringify(h.slice(0,50)))}catch(e){}}
clockView();
</script></body></html>
