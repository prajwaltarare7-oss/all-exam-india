plugins {
    id 'com.android.application'
}

android {
    namespace 'in.prajwaltarare7.allexamsindia'
    compileSdk 35

    defaultConfig {
        applicationId 'in.prajwaltarare7.allexamsindia'
        minSdk 23
        targetSdk 35
        versionCode 4
        versionName '1.3'
    }

    buildTypes {
        debug {
            debuggable false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
