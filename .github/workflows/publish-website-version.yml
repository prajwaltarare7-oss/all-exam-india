name: Publish website build version

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-website-version
  cancel-in-progress: false

jobs:
  publish-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Stamp the website build
        env:
          BUILD_ID: ${{ github.sha }}
        run: |
          python - <<'PY'
          import datetime, json, os, pathlib, re
          build = os.environ["BUILD_ID"]
          updated = datetime.datetime.now(datetime.timezone.utc).isoformat()
          page = pathlib.Path("index.html")
          source = page.read_text(encoding="utf-8")
          tag = f'<meta name="aei-build-id" content="{build}">'
          pattern = r'<meta name="aei-build-id" content="[^"]*">'
          if re.search(pattern, source):
              source = re.sub(pattern, tag, source, count=1)
          else:
              source = source.replace("<head>", "<head>\\n" + tag, 1)
          page.write_text(source, encoding="utf-8")
          pathlib.Path("version.json").write_text(
              json.dumps({"build": build, "updatedAt": updated}, separators=(",", ":")) + "\\n",
              encoding="utf-8"
          )
          PY

      - name: Commit published version marker
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html version.json
          if git diff --cached --quiet; then
            echo "Website build marker is already current."
            exit 0
          fi
          git commit -m "chore: publish website build version"
          git push origin HEAD:main
