name: ALL EXAM INDIA — continuous PYQ and mock pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: pyq-pipeline
  cancel-in-progress: false

jobs:
  collect-ocr-generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyq-system/requirements.txt
      - name: Install OCR engine and language packs
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-hin tesseract-ocr-mar
      - name: Install Python dependencies
        run: python -m pip install -r pyq-system/requirements.txt
      - name: Audit source reuse permissions
        run: python pyq-system/scripts/check_reuse_permissions.py
      - name: Collect links from official exam portals
        run: python pyq-system/scripts/monitor_sources.py
      - name: Build automatic PDF intake from approved source links
        run: python pyq-system/scripts/build_auto_intake.py
      - name: Discover question pages in permitted official HTML
        run: python pyq-system/scripts/collect_html_question_pages.py
      - name: Download explicitly approved PDFs
        run: python pyq-system/scripts/download_approved_pdfs.py
      - name: OCR owner-approved PDFs
        run: python pyq-system/scripts/process_intake.py
      - name: Parse OCR text into review candidates
        run: python pyq-system/scripts/parse_ocr_drafts.py
      - name: Match supplied answer keys
        run: python pyq-system/scripts/match_answer_keys.py
      - name: Detect duplicate candidates
        run: python pyq-system/scripts/deduplicate_bank.py
      - name: Validate explicitly reviewed central question bank
        run: python pyq-system/scripts/validate_reviewed_bank.py
      - name: Generate mocks from verified question bank
        run: python pyq-system/scripts/generate_all_mocks.py
      - name: Publish approved questions and PDFs to Firebase (optional)
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
        run: python pyq-system/scripts/publish_firebase.py
      - name: Upload collection, OCR drafts and generated mock drafts
        uses: actions/upload-artifact@v4
        with:
          name: all-exam-india-pyq-pipeline-${{ github.run_number }}
          path: |
            pyq-system/data/source-discoveries.json
            pyq-system/data/html-question-discoveries.json
            pyq-system/data/reuse-rights-report.json
            pyq-system/data/ocr-drafts/
            pyq-system/data/generated-mocks/
            pyq-system/data/pipeline-report.json
            pyq-system/data/intake-report.json
            pyq-system/data/download-report.json
            pyq-system/data/question-candidates.json
            pyq-system/data/answer-key-matches.json
            pyq-system/data/deduplicated-question-candidates.json
            pyq-system/data/bank-validation-report.json
          if-no-files-found: warn
          retention-days: 30
