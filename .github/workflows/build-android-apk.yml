name: Build All Exam India New APK

on:
  push:
    paths:
      - 'android/**'
      - 'assets/army-inspired-crest.svg'
      - '.github/workflows/build-android-apk.yml'
      - 'app-update.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build installable Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install Python image tools
        run: python -m pip install --disable-pip-version-check cairosvg pillow

      - name: Generate app icons from website logo
        working-directory: android
        run: python tools/generate_launcher_icons.py

      - name: Install Gradle 8.9
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Build debug APK (automatically signed for installation)
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: all-exam-india-new-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Prepare APK for release
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/all-exam-india-new.apk

      - name: Publish latest APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: All Exam India New
          body: New installable Android APK for All Exam India. This build uses the Android debug signing key; uninstall a differently signed older app before installing.
          files: release/all-exam-india-new.apk
          overwrite_files: true
          make_latest: true
