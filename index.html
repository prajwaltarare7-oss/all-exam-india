<style>

body.dark .exam-paper{background:#14213a;color:#e8eefb;border-color:#2b3b59}

/* Professional shared result screen for Mock Tests and future PYQ sets */
.result-wrap{background:linear-gradient(145deg,#fff 0%,#f7f9ff 100%);border:1px solid #dfe6f2;border-radius:22px;padding:clamp(17px,3vw,30px);box-shadow:0 14px 38px #172d5812;color:#17233d;margin:10px 0 22px}
.result-hero{display:grid;grid-template-columns:minmax(0,1fr) 150px;align-items:center;gap:20px;padding-bottom:22px;border-bottom:1px solid #e5eaf3}
.result-kicker{display:inline-flex;align-items:center;padding:7px 11px;border-radius:30px;background:#eaf0ff;color:#3155bd;font-size:11px;font-weight:900;letter-spacing:1px}
.result-hero h2{font-size:clamp(23px,4vw,31px);margin:12px 0 6px;color:#17233d}
.result-hero h2:after{display:none}
.result-hero p{color:#68748b;margin:0;line-height:1.6}
.result-grade{display:inline-flex;margin-top:13px;padding:8px 12px;border-radius:9px;background:#e9f8ef;color:#17633a;font-size:13px;font-weight:850}
.result-score-ring{width:138px;height:138px;border-radius:50%;background:conic-gradient(#315ee8 0deg var(--result-angle),#e7edf8 var(--result-angle) 360deg);display:grid;place-items:center;margin:auto}
.result-score-inner{width:108px;height:108px;border-radius:50%;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:inset 0 0 0 1px #e7edf6}
.result-score-inner strong{font-size:27px;line-height:1.1;color:#17233d}
.result-score-inner small{font-size:12px;color:#7b879b;font-weight:750;margin-top:4px}
.result-metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px;margin:18px 0}
.result-metric{padding:15px;border:1px solid #e3e9f3;border-radius:14px;background:#fff;min-width:0}
.result-metric span{display:block;color:#68748b;font-size:12px;font-weight:750}
.result-metric b{display:block;font-size:25px;line-height:1.2;margin-top:7px;color:#17233d}
.result-metric.correct b{color:#16804a}.result-metric.wrong b{color:#c13d48}.result-metric.unanswered b{color:#9a6b10}.result-metric.accuracy b{color:#315ee8}
.result-summary-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:12px 0 18px}
.result-summary-item{padding:13px 14px;border-radius:12px;background:#f0f4fb;border:1px solid #e4eaf4}
.result-summary-item span{display:block;font-size:11px;color:#68748b;font-weight:750}
.result-summary-item b{display:block;font-size:16px;color:#17233d;margin-top:5px}
.result-progress-wrap{margin:17px 0 5px}
.result-progress-label{display:flex;justify-content:space-between;gap:10px;color:#68748b;font-size:12px;font-weight:800;margin-bottom:8px}
.result-progress{height:10px;border-radius:20px;background:#e7edf7;overflow:hidden}
.result-progress>span{display:block;height:100%;border-radius:20px;background:linear-gradient(90deg,#315ee8,#25b8c8)}
.result-review{margin-top:20px}
.result-review details{border:1px solid #dfe6f1;border-radius:15px;background:#fff;overflow:hidden}
.result-review summary{cursor:pointer;padding:16px 18px;font-weight:850;color:#203252;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:12px}
.result-review summary::-webkit-details-marker{display:none}
.result-review summary:after{content:"＋";font-size:20px;color:#315ee8}
.result-review details[open] summary:after{content:"−"}
.result-review-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:0 14px 14px}
.result-answer-card{border:1px solid #e2e8f1;border-radius:12px;padding:14px;min-width:0;background:#fbfcff}
.result-answer-card.correct{border-left:4px solid #25a66a}.result-answer-card.wrong{border-left:4px solid #d85b63}.result-answer-card.unanswered{border-left:4px solid #d6a23a}
.result-answer-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.result-answer-top b{font-size:12px;color:#52617b}
.result-status{padding:5px 8px;border-radius:20px;font-size:10px;font-weight:900;white-space:nowrap}
.result-status.correct{background:#e6f7ed;color:#17633a}.result-status.wrong{background:#ffebec;color:#a52d37}.result-status.unanswered{background:#fff4d9;color:#8a5b08}
.result-question{font-weight:800;line-height:1.55;color:#17233d;margin:0 0 12px}
.result-answer-pair{display:grid;grid-template-columns:1fr;gap:8px}
.result-answer-pair>div{padding:9px 10px;border-radius:9px;background:#f1f4f9}
.result-answer-pair small{display:block;color:#68748b;font-size:10px;font-weight:850;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.result-answer-pair p{margin:0;font-size:13px;line-height:1.5;color:#263752}
.result-explanation{font-size:13px;line-height:1.6;color:#52617b;margin:11px 0 0;padding-top:10px;border-top:1px solid #e6ebf3}
.result-explanation b{color:#203252}
.result-review-heading{margin:20px 0 12px;padding:12px 14px;border-radius:12px;background:#eef3ff;color:#203b77;font-size:17px;font-weight:850}
body.dark .result-review-heading{background:#1c2d4b;color:#dce7ff}
.result-solution{margin-top:12px;border:1px solid #dce5f3;border-radius:10px;background:#f6f8fd;overflow:hidden}
.result-solution summary{display:block!important;visibility:visible!important;cursor:pointer;padding:13px 14px;font-size:14px;font-weight:900;color:#2349b5;list-style:none;background:#eaf0ff;border-radius:9px;min-height:44px}
.result-solution summary::-webkit-details-marker{display:none}
.result-solution summary:after{content:"＋";float:right;font-size:17px}
.result-solution[open] summary:after{content:"−"}
.result-solution-body{padding:0 12px 12px;font-size:13px;line-height:1.65;color:#34445f}
.result-solution-body>p{margin:2px 0 9px}
.result-solution-steps{margin:0;padding-left:22px}
.result-solution-steps li{padding:3px 0}
body.dark .result-solution{background:#172945;border-color:#34496d}
body.dark .result-solution summary{color:#a9c0ff}
body.dark .result-solution-body{color:#d8e3f7}
.result-action-bar{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0 4px}
.result-action-bar button{min-width:140px}
body.dark .result-wrap{background:linear-gradient(145deg,#14213a,#101b30);border-color:#2b3b59;color:#e8eefb}
body.dark .result-hero{border-color:#2b3b59}body.dark .result-hero h2,body.dark .result-score-inner strong,body.dark .result-metric b,body.dark .result-summary-item b,body.dark .result-question{color:#e8eefb}
body.dark .result-hero p,body.dark .result-metric span,body.dark .result-summary-item span{color:#aab6cc}

body.dark .result-summary-item,body.dark .result-answer-pair>div,body.dark .result-answer-card{background:#192a48;border-color:#34496d}
body.dark .result-review summary,body.dark .result-answer-top b,body.dark .result-answer-pair p,body.dark .result-explanation{color:#d8e3f7}

/* Question status stays closed until the three-line menu is tapped. */
.focused-top-tools{display:flex;align-items:center;gap:12px}
.focused-menu-toggle{display:flex;align-items:center;gap:6px;border:1px solid #dce3ef;border-radius:9px;background:#f4f7fc;color:#243451;padding:8px 10px;font-size:21px;font-weight:900;line-height:1}
.focused-menu-toggle small{font-size:11px}
body.dark:has(#testroom.active .focused-test) .focused-menu-toggle{background:#23344f;color:#e8eefb;border-color:#465a79}
/* Three-row question status strip with submit inside the palette. */
.focused-palette{flex:0 0 auto;border:1px solid #dce3ef;border-radius:12px;padding:10px;background:#f8faff}
.focused-palette-head{display:flex;justify-content:space-between;gap:8px;font-size:13px;margin-bottom:8px}
.focused-number-grid{display:grid;grid-auto-flow:column;grid-template-rows:repeat(3,32px);grid-auto-columns:36px;gap:6px;overflow-x:auto;padding:3px 2px 8px}
.focused-number{border:1px solid #dce3ef;border-radius:7px;background:#fff;color:#243451;font-weight:800}
.focused-number.answered{background:#dcf5e8;border-color:#8bd0a7;color:#17633a}
.focused-number.not-answered{background:#ffe4e4;border-color:#e7a0a0;color:#9b2828}
.focused-number.marked{background:#fff0c5;border-color:#e7c45b;color:#785600}
.focused-number.answered-marked{background:#dce8ff;border-color:#7898e8;color:#234b9a}
.focused-number.current{outline:2px solid #315ee8;outline-offset:1px}
.focused-legend{display:flex;flex-wrap:wrap;gap:10px;margin:2px 0 9px;font-size:11px}
.focused-legend span{display:flex;align-items:center;gap:4px}
.focused-legend i{width:8px;height:8px;border-radius:50%;display:inline-block}
.answered-dot{background:#36a269}.unanswered-dot{background:#dc6262}.marked-dot{background:#d4a32b}
.focused-submit{width:100%;min-height:40px;border:0;border-radius:9px;background:#16834a;color:#fff;font-weight:850;font-size:15px}
.focused-test-actions{grid-template-columns:1fr 1fr 1fr}
.focused-test-actions .mark-action{background:#b78316;color:#fff}
body.dark:has(#testroom.active .focused-test) .focused-palette{background:#192a48;border-color:#34496d}
body.dark:has(#testroom.active .focused-test) .focused-palette-head{color:#e8eefb}
body.dark:has(#testroom.active .focused-test) .focused-number{background:#23344f;color:#e8eefb;border-color:#465a79}
@media(max-height:700px){.focused-test{gap:8px;padding:10px}.focused-question{padding:8px 4px}.focused-question h2{margin-bottom:10px}.focused-question .test-choice{padding:9px;margin:6px 0}.focused-number-grid{grid-template-rows:repeat(3,27px);grid-auto-columns:31px}.focused-test-actions button{min-height:42px}}
/* Keep the pre-test instructions page scrollable on mobile. */
body:has(.test-instructions){overflow-y:auto!important;overflow-x:hidden!important;height:auto!important}
body:has(.test-instructions) .container{height:auto!important;min-height:100dvh!important;overflow:visible!important}
body:has(.test-instructions) #testroom{height:auto!important;min-height:0!important;overflow:visible!important}
body:has(.test-instructions) #testArea{height:auto!important;overflow:visible!important;padding-bottom:24px}
.test-instructions{max-height:none!important;overflow:visible!important;margin:14px auto 28px!important}

/* After submission, release the locked CBT viewport so the full result and solutions can scroll on mobile. */
@media(max-width:760px){
 body.aei-test-active:has(#testResult .result-wrap),
 body.aei-test-active:has(#testResult .result-review){height:auto!important;min-height:100%!important;overflow-y:auto!important;overflow-x:hidden!important;position:static!important}
 body.aei-test-active:has(#testResult .result-wrap) .container,
 body.aei-test-active:has(#testResult .result-review) .container{height:auto!important;min-height:100dvh!important;overflow:visible!important}
 body.aei-test-active:has(#testResult .result-wrap) #testroom.page.active,
 body.aei-test-active:has(#testResult .result-review) #testroom.page.active{position:relative!important;inset:auto!important;height:auto!important;min-height:100dvh!important;max-height:none!important;overflow:visible!important;padding:12px 10px 32px!important}
 body.aei-test-active:has(#testResult .result-wrap) #testArea,
 body.aei-test-active:has(#testResult .result-review) #testArea{height:auto!important;min-height:0!important;overflow:visible!important}
 body.aei-test-active:has(#testResult .result-wrap) #testResult,
 body.aei-test-active:has(#testResult .result-review) #testResult{display:block!important;height:auto!important;max-height:none!important;overflow:visible!important;padding-bottom:30px}
 body.aei-test-active:has(#testResult .result-wrap) .result-review,
 body.aei-test-active:has(#testResult .result-review) .result-review{overflow:visible!important}
}
