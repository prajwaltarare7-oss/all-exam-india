<!doctype html>
<html lang="mr">
<head>
<meta name="aei-build-id" content="09e0055bb5c85cfacb73148f8bbcac0177c33371">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101b35"><title>ALL EXAM INDIA</title>
<meta name="description" content="Exam-wise previous year questions, MCQ practice, mock tests and full-length tests.">
<style>
:root{--navy:#101b35;--blue:#315ee8;--cyan:#25b8c8;--ink:#17233d;--muted:#68748b;--paper:#f5f7fc;--line:#e4e9f2;--green:#16834a}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,system-ui,Arial,sans-serif}
header{background:linear-gradient(125deg,#0c1730,#172d58 65%,#174b70);color:#fff;padding:24px max(18px,calc((100% - 1120px)/2))}
header h1{margin:0;font-size:clamp(23px,4vw,34px);letter-spacing:1px}header p{margin:7px 0 0;color:#d5e2ff}
main{max-width:1120px;margin:auto;padding:22px 16px 50px}.topline{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h2{font-size:22px;margin:10px 0}.sub{color:var(--muted);line-height:1.6}
.search{width:100%;padding:14px;border:1px solid var(--line);border-radius:12px;background:white;font:inherit;margin:12px 0}
.filters{display:flex;gap:8px;overflow:auto;padding:3px 0 12px}.filter{white-space:nowrap;border:1px solid var(--line);border-radius:30px;padding:9px 13px;background:#fff;color:#35425d;font-weight:700}
.filter.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:13px}
.exam{background:#fff;border:1px solid var(--line);border-radius:16px;padding:17px;text-align:left;box-shadow:0 6px 20px #18294b08;cursor:pointer;min-height:112px}
.exam:hover{border-color:#9db2ff;transform:translateY(-2px)}.exam b{display:block;font-size:16px;margin-bottom:8px}.exam span{color:var(--muted);font-size:12px}
.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:clamp(16px,3vw,25px);margin-top:16px}
.back{border:0;background:#eaf0ff;color:#244bd0;border-radius:9px;padding:10px 13px;font-weight:800}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-top:16px}
.tile{border:1px solid var(--line);border-radius:14px;padding:18px;background:#fff;text-align:left;cursor:pointer}
.tile b{display:block;font-size:17px;margin-bottom:7px}.tile span{color:var(--muted);font-size:13px;line-height:1.5}
.tile.pyq{border-top:4px solid #315ee8}.tile.mcq{border-top:4px solid #16834a}.tile.mock{border-top:4px solid #9a61d4}.tile.full{border-top:4px solid #db8b24}
.list{display:grid;gap:10px;margin-top:14px}.item{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;justify-content:space-between;align-items:center;gap:12px;background:#fff}
.item button,.action{border:0;background:var(--blue);color:#fff;border-radius:9px;padding:10px 13px;font-weight:800}
.notice{background:#fff7df;border:1px solid #f0d998;border-radius:12px;padding:14px;line-height:1.6;color:#6e5314}
.empty{background:#f1f5fc;border:1px dashed #bdc9dc;border-radius:12px;padding:18px;color:#586781;line-height:1.65}
footer{text-align:center;padding:24px;color:#7d899f;border-top:1px solid var(--line);background:#fff}
@media(max-width:520px){.exam{min-height:98px}.item{align-items:flex-start;flex-direction:column}.item button{width:100%}}
</style></head>
<body>
<header><h1>ALL EXAM INDIA</h1><p>प्रत्येक परीक्षेसाठी स्वतंत्र PYQ, MCQ आणि Mock Test विभाग</p></header>
<main>
<div style="max-width:1120px;margin:0 auto 14px;padding:0 16px"><a href="./auto-mock.html" style="display:inline-block;background:#315ee8;color:#fff;text-decoration:none;padding:12px 16px;border-radius:10px;font-weight:800">⚡ Auto Mock Test Generator</a></div>
<section id="home">
 <div class="topline"><div><h2>सर्व परीक्षा</h2><div class="sub" id="countline">परीक्षा शोधा आणि निवडा</div></div></div>
 <input class="search" id="search" placeholder="परीक्षेचे नाव शोधा..." autocomplete="off">
 <div class="filters" id="filters"></div><div class="grid" id="examGrid"></div>
 <p class="sub">प्रत्येक परीक्षेचे PYQ, MCQ Practice, Mock Test आणि Full-length Test स्वतंत्र पेजमध्ये उघडतील.</p>
</section>
<section id="examPage" hidden></section>
<section id="sectionPage" hidden></section>
</main>
<footer>ALL EXAM INDIA · Exam-wise Question Practice</footer>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="./firebase-config.js"></script>
<script>
let db=null;
try { if(window.ALL_EXAM_FIREBASE_CONFIG && window.ALL_EXAM_FIREBASE_CONFIG.apiKey) { firebase.initializeApp(window.ALL_EXAM_FIREBASE_CONFIG); db=firebase.firestore(); } } catch(e) { console.warn("Firebase setup:",e); }
const categories={"Defence & UPSC":["NDA","CDS","AFCAT","UPSC Civil Services (IAS/CSE)","UPSC CMS","Indian Coast Guard Assistant Commandant","UPSC Engineering Services (ESE)","UPSC CAPF"],"SSC & Central Recruitment":["SSC CGL","SSC CHSL","SSC GD Constable","SSC JE","SSC MTS","SSC CPO","SSC JHT","SSC Selection Post","RPF SI","MPPEB Jail Prahari","NSC Management Trainee"],"Railways":["RRB NTPC","RRB Group D"],"Banking & Insurance":["SBI PO","SBI Clerk","IBPS PO","IBPS Clerk","IBPS RRB","IBPS SO","RBI Assistant","RBI Grade B","ICICI Bank PO","NIACL Assistant"],"State Services":["BPSC Civil Services","UPPSC PCS","CGPSC State Service","MPPSC State Service","TNPSC Group 4","RPSC RAS","TSPSC Group 4","APPSC Assistant Professor","MPPSC State Forest Service","Jharkhand JGGLCCE","Bihar Judicial Service"],"Teaching & Eligibility":["CTET","UPTET","UGC NET","CSIR UGC NET","REET","HTET","APTET","Haryana CET","HP TET","Maha TET","MP TET","TNTET","TS TET","UPSSSC PET","WB SET","KSET","Bihar STET","TS SET","MP SET","TN SET","USET","OSSTET"]};
const sourceTotal=145;
const all=Object.entries(categories).flatMap(([category,names])=>names.map(name=>({name,category,id:name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g)})));
let activeCategory='सर्व',currentExam=null;
const $=id=>document.getElementById(id);
function show(id){$('home').hidden=id!=='home';$('examPage').hidden=id!=='examPage';$('sectionPage').hidden=id!=='sectionPage';window.scrollTo(0,0)}
function renderFilters(){
 const names=['सर्व',...Object.keys(categories)];
 $('filters').innerHTML=names.map(n=>'<button class="filter '+(n===activeCategory?'active':'')+'" data-cat="'+n+'">'+n+'</button>').join('');
 $('filters').querySelectorAll('button').forEach(b=>b.onclick=()=>{activeCategory=b.dataset.cat;renderFilters();renderExams()});
}
function renderExams(){
 const q=$('search').value.trim().toLowerCase();
 const list=all.filter(x=>(activeCategory==='सर्व'||x.category===activeCategory)&&x.name.toLowerCase().includes(q));
 $('countline').textContent=list.length+' परीक्षा या पहिल्या कॅटलॉग बॅचमध्ये · संदर्भ वेबसाइटवर 145 परीक्षा दाखवल्या आहेत';
 $('examGrid').innerHTML=list.map(x=>'<button class="exam" data-id="'+x.id+'"><b>'+x.name+'</b><span>'+x.category+' · स्वतंत्र विभाग उघडा →</span></button>').join('')||'<div class="empty">या नावाची परीक्षा सापडली नाही.</div>';
 $('examGrid').querySelectorAll('button').forEach(b=>b.onclick=()=>openExam(all.find(x=>x.id===b.dataset.id)));
}
function openExam(exam){
 currentExam=exam;history.pushState({page:'exam',id:exam.id},'','#exam='+exam.id);
 $('examPage').innerHTML='<button class="back" id="backHome">← सर्व परीक्षा</button><div class="panel"><h2>'+exam.name+'</h2><p class="sub">'+exam.category+'</p><p>या परीक्षेसाठी खालील विभाग स्वतंत्रपणे उघडा.</p><div class="tiles">'+
 '<button class="tile pyq" data-kind="pyq"><b>📚 Previous Year Questions (PYQ)</b><span>वर्षनिहाय मागील प्रश्नपत्रिका आणि MCQ प्रश्न</span></button>'+
 '<button class="tile mcq" data-kind="mcq"><b>☑ MCQ Practice</b><span>विषयनिहाय स्वतंत्र बहुपर्यायी प्रश्न सराव</span></button>'+
 '<button class="tile mock" data-kind="mock"><b>📝 Mock Test</b><span>नवीन सराव मॉक टेस्ट आणि निकाल</span></button>'+
 '<button class="tile full" data-kind="full"><b>⏱ Full-length Exam Test</b><span>अधिकृत परीक्षेच्या पॅटर्ननुसार पूर्ण वेळेची टेस्ट</span></button>'+
 '</div></div>';
 $('examPage').querySelector('#backHome').onclick=()=>{history.pushState({page:'home'},'','#');show('home')};
 $('examPage').querySelectorAll('[data-kind]').forEach(b=>b.onclick=()=>openSection(exam,b.dataset.kind));
 show('examPage');
}
const labels={pyq:'Previous Year Questions (PYQ)',mcq:'MCQ Practice',mock:'Mock Test',full:'Full-length Exam Test'};
function safe(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function optionList(q){
 const opts=Array.isArray(q.options)?q.options:[];
 return opts.map((o,i)=>{const key=typeof o==='string'?String.fromCharCode(65+i):(o.key||String.fromCharCode(65+i));const val=typeof o==='string'?o:o.text;return {key,text:val}});
}
function renderQuestion(q,i,interactive=true){
 const opts=optionList(q);
 const based=q.contentType==='original_practice';
 const tag=based?'<span style="display:inline-block;margin:8px 0 0;padding:4px 9px;border-radius:20px;background:#fff1d6;color:#80520b;font-size:12px;font-weight:800">मूळ सराव प्रश्न · PYQ नाही</span>':'<span style="display:inline-block;margin:8px 0 0;padding:4px 9px;border-radius:20px;background:#e8efff;color:#244bd0;font-size:12px;font-weight:800">मूळ PYQ</span>';
 return '<article class="item" style="display:block"><b>Q'+(q.questionNo||i+1)+'. '+safe(q.question||q.text)+'</b><div>'+tag+'</div><div class="sub">'+safe(q.subject||'')+' '+(q.year?'· '+safe(q.year):'')+'</div><div class="list">'+opts.map(o=>'<button class="tile answer-option" data-q="'+i+'" data-answer="'+safe(o.key)+'" style="text-align:left;padding:11px">'+safe(o.key)+'. '+safe(o.text)+'</button>').join('')+'</div><div class="sub answer-feedback" id="feedback-'+i+'"></div></article>';
}
async function openSection(exam,kind){
 history.pushState({page:'section',id:exam.id,kind},'','#'+kind+'/'+exam.id);
 $('sectionPage').innerHTML='<button class="back" id="backExam">← '+safe(exam.name)+'</button><div class="panel"><h2>'+safe(exam.name)+' — '+labels[kind]+'</h2><p class="sub">प्रश्नसंच लोड होत आहे...</p><div id="questionArea" class="list"></div></div>';
 $('sectionPage').querySelector('#backExam').onclick=()=>openExam(exam);
 show('sectionPage');
 const area=$('questionArea');
 if(!db){area.innerHTML='<div class="notice">Firebase Web App configuration अजून जोडलेले नाही. Firebase Console मधील Web App config firebase-config.js मध्ये सेट केल्यावर प्रश्न आपोआप इथे लोड होतील.</div>';return;}
 try{
  const snap=await db.collection('questionBank').doc(exam.id).collection('questions').where('published','==',true).get();
  let questions=snap.docs.map(d=>({id:d.id,...d.data()}));
  if(kind==='mock'||kind==='full'){
    const testSnap=await db.collection('questionBank').doc(exam.id).collection('tests').where('published','==',true).get();
    let tests=testSnap.docs.map(d=>({id:d.id,...d.data()}));
    if(!tests.length){
      area.innerHTML='<div class="empty"><b>अधिकृत पॅटर्ननुसार पडताळलेली टेस्ट अजून उपलब्ध नाही.</b><br>पुरेसे पडताळलेले प्रश्न आणि verified exam profile मिळाल्यावर टेस्ट येथे आपोआप प्रकाशित होईल.</div>';
      return;
    }
    area.innerHTML='<div class="list">'+tests.map((t,i)=>'<article class="item" style="display:block"><b>'+safe(t.title||'Mock Test')+'</b><p class="sub">'+Number(t.totalQuestions||t.questions?.length||0)+' प्रश्न · '+Number(t.durationMinutes||0)+' मिनिटे · बरोबर +'+Number(t.marksCorrect||0)+' · चुकीचे '+Number(t.marksWrong||0)+'</p><button class="action" data-test="'+i+'">टेस्ट सुरू करा</button></article>').join('')+'</div>';
    area.querySelectorAll('[data-test]').forEach(btn=>btn.onclick=()=>{
      const t=tests[Number(btn.dataset.test)], qs=Array.isArray(t.questions)?t.questions:[];
      if(!qs.length){area.innerHTML='<div class="notice">या टेस्टमध्ये प्रश्न उपलब्ध नाहीत.</div>';return;}
      let remaining=Math.max(1,Number(t.durationMinutes||1))*60, finished=false;
      area.innerHTML='<div class="notice"><b id="testClock"></b> · '+qs.length+' प्रश्न · प्रत्येक बरोबर उत्तराला +'+Number(t.marksCorrect||0)+' आणि चुकीला '+Number(t.marksWrong||0)+'</div><div id="liveTest" class="list">'+qs.map((q,i)=>renderQuestion(q,i)).join('')+'</div><button class="action" id="finishTest">टेस्ट सबमिट करा</button><p id="liveResult" class="sub"></p>';
      const clock=area.querySelector('#testClock');
      const tick=()=>{if(finished)return;clock.textContent='वेळ: '+Math.floor(remaining/60)+' मिनिटे '+(remaining%60)+' सेकंद';if(remaining<=0){finish();return;}remaining--;};
      const timer=setInterval(tick,1000);tick();
      function finish(){if(finished)return;finished=true;clearInterval(timer);let score=0,correct=0,wrong=0,unanswered=0;
        qs.forEach((q,i)=>{const chosen=area.querySelector('[data-q="'+i+'"].chosen');const answer=String(q.correctOption||q.answer||'').toUpperCase();if(!chosen){unanswered++;return;}if(chosen.dataset.answer===answer){correct++;score+=Number(t.marksCorrect||0);}else{wrong++;score+=Number(t.marksWrong||0);}});
        area.querySelector('#liveResult').textContent='निकाल: '+score+' गुण · बरोबर: '+correct+' · चुकीचे: '+wrong+' · अनुत्तरित: '+unanswered;
        area.querySelector('#finishTest').disabled=true;
      }
      area.querySelector('#finishTest').onclick=finish;
    });
    return;
  }
  if(kind==='pyq') questions=questions.filter(q=>q.year||q.contentType==='original_practice');
  if(!questions.length){area.innerHTML='<div class="empty"><b>अद्याप पडताळलेले प्रश्न उपलब्ध नाहीत.</b><br>Firebase मध्ये या परीक्षेसाठी published=true असलेले प्रश्न आले की ते इथे आपोआप दिसतील. बनावट प्रश्न दाखवले जाणार नाहीत.</div>';return;}
  if(kind==='pyq'){
    const years=[...new Set(questions.map(q=>String(q.year)))].sort().reverse();
    area.innerHTML='<label>वर्ष निवडा</label><select id="yearFilter" class="search"><option value="">सर्व वर्षे</option>'+years.map(y=>'<option>'+safe(y)+'</option>').join('')+'</select><div id="pyqList" class="list"></div>';
    const paint=()=>{const y=$('yearFilter').value;const filtered=questions.filter(q=>!y||String(q.year)===y);$('pyqList').innerHTML=filtered.map((q,i)=>renderQuestion(q,i)).join('');wireAnswers(filtered);};
    $('yearFilter').onchange=paint;paint();return;
  }
  if(kind==='mcq'){
    area.innerHTML=questions.map((q,i)=>renderQuestion(q,i)).join('');wireAnswers(questions);return;
  }
  const mode=kind==='full'?'Full-length Exam Test':'Mock Test';
  area.innerHTML='<div class="notice">'+mode+' सुरू करण्यासाठी उपलब्ध पडताळलेले प्रश्न वापरले जातील. अधिकृत प्रश्नसंख्या, वेळ व गुणपद्धती verified exam profile मध्ये उपलब्ध असेल तेव्हाच लागू होईल.</div><button class="action" id="startQuiz">Test सुरू करा ('+questions.length+' प्रश्न)</button><div id="testList" class="list"></div><button class="action" id="submitQuiz" style="display:none">उत्तर सबमिट करा</button><p id="testResult" class="sub"></p>';
  $('startQuiz').onclick=()=>{$('testList').innerHTML=questions.map((q,i)=>renderQuestion(q,i)).join('');$('submitQuiz').style.display='inline-block';wireAnswers(questions);};
  $('submitQuiz').onclick=()=>{let correct=0,answered=0;questions.forEach((q,i)=>{const chosen=document.querySelector('[data-q="'+i+'"].chosen');if(chosen){answered++;if(chosen.dataset.answer===String(q.correctOption||q.answer||'').toUpperCase())correct++;}});$('testResult').textContent='उत्तर दिले: '+answered+'/'+questions.length+' · बरोबर: '+correct+' · निकाल प्रश्नसंचाच्या उपलब्ध उत्तरांवर आधारित.';};
 }catch(e){console.error(e);area.innerHTML='<div class="notice">Firebase मधून प्रश्न लोड करता आले नाहीत. Firestore rules आणि Firebase configuration तपासा.</div>';}
}
function wireAnswers(questions){
 document.querySelectorAll('.answer-option').forEach(btn=>btn.onclick=()=>{
  const i=Number(btn.dataset.q);document.querySelectorAll('[data-q="'+i+'"]').forEach(x=>x.classList.remove('chosen'));btn.classList.add('chosen');
  const q=questions[i];const key=String(q.correctOption||q.answer||'').toUpperCase();
  const fb=$('feedback-'+i);
  if(fb) fb.textContent=key?'उत्तर निवडले. सबमिट केल्यावर निकाल दिसेल.':'उत्तरतालिका अद्याप उपलब्ध नाही.';
 });
}
$('search').addEventListener('input',renderExams);
window.addEventListener('popstate',()=>{const h=location.hash.slice(1);if(h.startsWith('exam=')){const id=h.slice(5);const x=all.find(v=>v.id===id);if(x)openExam(x);else show('home')}else if(h.includes('/')){const [kind,id]=h.split('/');const x=all.find(v=>v.id===id);if(x)openSection(x,kind);else show('home')}else show('home')});
renderFilters();renderExams();show('home');
</script>
</body></html>
